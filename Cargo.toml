[package]
name = "readme-viewer-tui"
version = "0.2.0"
edition = "2024"
description = "An interactive README viewer and Markdown converter"
license = "MIT"
repository = "https://github.com/LIghtJUNction/readme"
keywords = ["readme", "markdown", "tui", "terminal"]
categories = ["command-line-utilities"]

[[bin]]
name = "readme"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
pulldown-cmark = "0.13"
ratatui = "0.29"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts"] }
ureq = "3"
percent-encoding = "2"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
