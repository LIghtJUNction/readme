[package]
name = "readme-viewer-tui"
version = "0.1.0"
edition = "2024"
description = "An interactive README viewer and Markdown converter"
license = "MIT"
repository = "https://github.com/LIghtJUNction/readme"
keywords = ["readme", "markdown", "tui", "terminal"]
categories = ["command-line-utilities"]

[[bin]]
name = "readme"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
pulldown-cmark = "0.13"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
